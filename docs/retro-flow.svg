<text x="975" y="366" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, Consolas, Liberation Mono, monospace" fill="#5b4bd6">written by /retro, nothing else</text>
<polyline points="975,377 975,418" fill="none" stroke="#5b4bd6" stroke-width="1.6" marker-end="url(#arrow-accent)"/><text x="986" y="402" text-anchor="start" font-size="11.5" font-family="IBM Plex Mono, ui-monospace, Consolas, Liberation Mono, monospace" fill="#5b4bd6">@-import</text>
<rect x="815" y="425" width="320" height="80" rx="10" fill="#ffffff" stroke="#5b4bd6" stroke-width="1.5"/>
