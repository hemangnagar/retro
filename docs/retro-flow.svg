<text x="390.0" y="800" text-anchor="middle" font-size="15" font-weight="600" fill="#1b1f24">Budget gate</text>
<text x="390.0" y="819" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, Consolas, Liberation Mono, monospace" fill="#5f6670">playbook capped at 25 slots</text>
<text x="390.0" y="837" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, Consolas, Liberation Mono, monospace" fill="#5f6670">must displace the weakest — or is rejected</text>
