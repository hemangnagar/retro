<text x="390.0" y="463" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, Consolas, Liberation Mono, monospace" fill="#5f6670">answers drafted from the evidence</text>
<text x="390.0" y="481" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, Consolas, Liberation Mono, monospace" fill="#5f6670">you reply: agree · edit · skip</text>
