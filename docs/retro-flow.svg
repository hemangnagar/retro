<text x="390.0" y="675" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, Consolas, Liberation Mono, monospace" fill="#5f6670">one lesson at a time</text>
<text x="390.0" y="693" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, Consolas, Liberation Mono, monospace" fill="#5f6670">project | stack | global | discard</text>
<rect x="462" y="624" width="98" height="22" rx="11" fill="#fbf1dc" stroke="#b7791f" stroke-width="1.2"/><text x="511.0" y="639" text-anchor="middle" font-size="11" font-weight="700" letter-spacing=".06em" fill="#b7791f">HUMAN GATE</text>
