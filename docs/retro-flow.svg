<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1090" width="100%" role="img" aria-label="How retro works: a milestone triggers a retro; three local inputs feed a four-question interview a person confirms; each lesson is scoped from a closed menu; project lessons go to learned-behavior, stack and global lessons pass a size budget into a playbook loaded every session, discards are recorded in retro.json, and the retro tag becomes the next retro's boundary." font-family="IBM Plex Sans, Segoe UI, Liberation Sans, system-ui, sans-serif">
<rect width="1200" height="1090" fill="#f6f5f1"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1f24"/></marker>
  <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b4bd6"/></marker>
</defs>
<rect x="90" y="36" width="470" height="52" fill="#d9d3ff"/>
<text x="100" y="76" font-size="36" fill="#1b1f24"><tspan font-weight="800">Milestone Retrospectives</tspan><tspan font-weight="400" dx="16">with a curated playbook</tspan></text>
<text x="600" y="118" text-anchor="middle" font-size="16.5" fill="#5f6670">retro turns what a project taught into lessons scoped to where they belong. A person decides what a lesson is about;</text>
<text x="600" y="141" text-anchor="middle" font-size="16.5" fill="#5f6670">a size budget decides what stays. Nothing here runs per task — only at milestones.</text>
<rect x="230" y="190" width="320" height="62" rx="10" fill="#ffffff" stroke="#1b1f24" stroke-width="1.5"/>
<text x="390.0" y="213" text-anchor="middle" font-size="15" font-weight="600" fill="#1b1f24">Milestone reached</text>
<text x="390.0" y="232" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, Consolas, Liberation Mono, monospace" fill="#5f6670">release tag · merge to main · archive</text>
