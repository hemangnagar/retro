<rect x="230" y="540" width="320" height="60" rx="10" fill="#ffffff" stroke="#1b1f24" stroke-width="1.5"/>
<text x="390.0" y="562" text-anchor="middle" font-size="15" font-weight="600" fill="#1b1f24">Distill</text>
<text x="390.0" y="581" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, ui-monospace, Consolas, Liberation Mono, monospace" fill="#5f6670">claim · evidence · confidence</text>
