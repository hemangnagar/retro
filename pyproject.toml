[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retro"
version = "0.1.0"
description = "Milestone retrospectives that carry transferable lessons across projects (scope-tagged, size-capped playbook; pairs with learned-behavior)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
retro = "retro.cli:main"

[tool.setuptools]
packages = ["retro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
